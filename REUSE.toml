# This file describes the licensing and copyright situation for files that
# cannot be annotated directly, for example because of being simply
# uncommentable. Unless this is the case, a file should be annotated directly.
#
# This follows the REUSE specification: https://reuse.software/spec-3.3/#reusetoml

version = 1

[[annotations]]
path = [
    ".gitlab/**",
    "fastlane/**",
    "CHANGELOG",
    "README.md",
    "DISCLAIMER.md",
    "POLICY.md",
    "updates.json",
    "app/schemas/**",
    "app/testkey.jks",
    "app/src/main/**/*.png",
    "app/src/main/res/resources.properties",
    # Launcher icons for the debug/nightly variants; binary, cannot be annotated.
    "app/src/debug/res/**/*.png",
    "app/src/nightly/res/**/*.png",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2021-2026 Aurora OSS",
    "2023-2025 The Calyx Institute"
]
SPDX-License-Identifier = "GPL-3.0-or-later"

# Translations are managed by Weblate, which rewrites these files wholesale on
# every sync and would drop an inline header.
[[annotations]]
path = "app/src/main/res/values-*/strings.xml"
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2021-2026 Aurora OSS",
    "2021-2026 Aurora Store translators"
]
SPDX-License-Identifier = "GPL-3.0-or-later"

# Root CA bundle fetched verbatim from https://pki.goog/roots.pem for
# certificate pinning; annotated here so updates stay a straight file swap.
[[annotations]]
path = "app/src/main/res/raw/google_roots_ca.pem"
precedence = "aggregate"
SPDX-FileCopyrightText = "Google Trust Services LLC"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "gradle/wrapper/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2007-2023 Gradle, Inc."
SPDX-License-Identifier = "Apache-2.0"
